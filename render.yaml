services:
  - type: web
    name: zupply
    runtime: node
    rootDir: app
    buildCommand: npm install --prefix server && npm install --prefix web && npm run build --prefix web && npm run build --prefix server
    startCommand: node server/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: '*'
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zupply-db
          property: connectionString

databases:
  - name: zupply-db
    databaseName: zupply
    user: zupply
    plan: free
